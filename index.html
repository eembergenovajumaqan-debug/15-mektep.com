<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block One — Rasmiy Ilova</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0066ff">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body {
      background: linear-gradient(135deg, #090d16, #111c33);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .app-icon {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0, 102, 255, 0.4);
      object-fit: cover;
    }
    h1 { font-size: 26px; margin-bottom: 10px; }
    p { color: #a0aec0; font-size: 15px; line-height: 1.5; margin-bottom: 28px; }
    .download-btn {
      background: linear-gradient(90deg, #0066ff, #0099ff);
      color: white;
      border: none;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 20px rgba(0, 102, 255, 0.35);
    }
    .download-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 102, 255, 0.5); }
    .download-btn:active { transform: scale(0.98); }
    .hint { margin-top: 16px; font-size: 12px; color: #718096; }
  </style>
</head>
<body>

  <div class="card">
    <img src="icon.png" alt="Block One" class="app-icon">
    <h1>Block One</h1>
    <p>Ilovani qurilmangizga yuklab oling va internet orqali qulay foydalaning.</p>
    <button id="installBtn" class="download-btn">⬇ Ilovani yuklab olish</button>
    <div id="statusText" class="hint">Google Chrome orqali o'rnatish uchun tayyor</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    const statusText = document.getElementById('statusText');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      statusText.textContent = "Tugmani bosing — ilova darhol o'rnatiladi";
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          statusText.textContent = "Ilova muvaffaqiyatli yuklab olindi!";
        }
        deferredPrompt = null;
      } else {
        alert("O'rnatish uchun brauzer menyusini (⋮) oching va 'Ilovani o'rnatish' (Install app) tugmasini bosing.");
      }
    });
  </script>

</body>
</html>
